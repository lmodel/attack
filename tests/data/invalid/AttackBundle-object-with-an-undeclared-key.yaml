    name: Programmable Automation Controller (PAC)
    description: A Programmable Automation Controller (PAC) is an embedded programmable
      control device. PACs are designed to enable automation applications across
      integrated software applications, peer controllers (e.g., PLC), Human Machine
      Interfaces, and other systems. PACs often include advanced features for process
      control, motion control, drive control, and vision applications. PACs are
      programmed using traditional process automation programming languages (IEC-61131)
      and sometimes languages such as C and C++ to support more advanced controls.
    x_mitre_sectors:
      - General
    x_mitre_related_assets:
      - name: Field Device / Controller
        related_asset_sectors:
          - General
        description: Programmable Automation Controller (PAC) may be referred to
          as Field Controllers or Field Devices as a general function name.
      - name: Programmable Logic Controller (PLC)
        related_asset_sectors:
          - General
        description: 'Programmable Logic Controllers (PLC) share some of the same
          functionality as PACs, although often without more advanced control features.
          Historically, differences between PLCs and PACs were minimal, resulting
          in varying use of the terms across industry. '
