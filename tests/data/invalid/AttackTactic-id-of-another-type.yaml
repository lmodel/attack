name: Stealth
description: 'The adversary is trying to hide and conceal their actions, appearing
  as normal behavior.


  Stealth consists of techniques that reduce the likelihood of detection by blending
  in with legitimate activity or minimizing observable signals. These techniques
  are characterized by concealment behaviors, such as avoiding, obfuscating, or
  mimicking normal operations, without modifying security controls or compromising
  collection and monitoring feeds. The goal is to remain indistinguishable from
  benign activity while leaving defensive systems intact.'
