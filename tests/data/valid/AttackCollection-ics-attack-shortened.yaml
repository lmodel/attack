description: The ATT&CK for Industrial Control Systems (ICS) knowledge base categorizes
  the unique set of tactics, techniques, and procedures (TTPs) used by threat actors
  in the ICS technology domain. ATT&CK for ICS outlines the portions of an ICS attack
  that are out of scope of Enterprise and reflects the various phases of an adversary’s
  attack life cycle and the assets and systems they are known to target.
