// A bundle of ATT&CK objects, as MITRE publishes each release of a domain: the domain's collection first, then the objects it holds. It adds no slot to StixBundle, which stays the schema's tree root; the generated JSON Schema takes AttackBundle as its top class.
message AttackBundle {
  // The identifier of the object: its STIX type, two hyphens and a UUID. Each class narrows the type.
  string id = 1;
  // The STIX type name of the object, such as attack-pattern. Each class pins its own.
  string type = 2;
  // The STIX objects in the bundle.
  repeated StixObject objects = 3;
}
