---
id: https://w3id.org/lmodel/attack
name: attack
title: MITRE ATT&CK
description: >-
  A LinkML model of MITRE ATT&CK as MITRE publishes it in STIX 2.1: the
  tactics, techniques, groups, campaigns, software, mitigations, assets, data
  sources, data components, detection strategies and analytics of the
  Enterprise, Mobile and ICS domains, and the matrices, collections,
  relationships, identity and marking that hold them together. Each class
  extends the lmodel/stix class it builds on, and ATT&CK's own properties keep
  the keys MITRE's data writes, so MITRE's bundles validate unchanged.
version: "20.0"
source: https://github.com/mitre-attack/attack-stix-data/releases/tag/v20.0
license: Apache-2.0
see_also:
  - https://lmodel.github.io/attack
  - https://attack.mitre.org/resources/versions/
  - https://mitre-attack.github.io/attack-data-model/schemas/
annotations:
  attack_release_date: "2026-10-13"
  attack_stix_data_commit: 20664a889568dce884a1dac0ec7b12ae3a199f51
  attack_spec_version: "3.3.0"
  attack_data_model_release: v4.11.7
  attack_data_model_commit: 99558689a7efecbb9eec74b1b1a5b6fbfad25f8a
  stix_version: "2.1"
comments:
  - >-
    The version is the ATT&CK release the schema renders, and source is that
    release of mitre-attack/attack-stix-data, at the commit in the
    annotations. tests/data/attack-stix-data/manifest.json pins its bundles by
    hash, and scripts/check_upstream_release.py reports a newer release.
  - >-
    The ATT&CK Data Model (ADM), mitre-attack/attack-data-model, defines the
    STIX extensions ATT&CK uses. MITRE marks every release of its v4.11 line as
    a pre-release, published under npm's next tag, while npm's latest is
    v4.10.1. The schema follows v4.11.7 all the same, because the schema fixes
    of v4.11.1 to v4.11.6 match the v20.0 data, which post-dates them.
  - >-
    The schema follows the data MITRE publishes. Where the v20.0 data departs
    from the ADM, the schema accepts the data, and tests/test_upstream.py
    lists each departure with its reason.
  - >-
    Some of the ADM's rules are beyond the validator, and the tests check them
    over the examples and the bundles: the first external reference of an
    object carries its ATT&CK ID, in the form the class's attack_id_pattern
    annotation gives; the first alias of an object is its name; a campaign's
    citations name its external references; a property annotated with
    attack_domains appears only on an object of one of those domains, one
    annotated with attack_excluded_domains never on an object of those, and
    one annotated with attack_tactic only beside a kill chain phase of that
    tactic; some lists name each item once; and a technique has at least one
    kill chain phase.
default_prefix: attack
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  attack: https://w3id.org/lmodel/attack/
  stix: https://w3id.org/lmodel/stix/

# The stix modules sit in stix/, copied from lmodel/stix. The domain-object
# module imports the cyber-observable module, and the umbrella module holds
# the bundle, so all six load.
imports:
  - linkml:types
  - ./stix/stix_vocabularies
  - ./stix/stix_core
  - ./stix/stix_sdo
  - ./stix/stix_sro
  - ./stix/stix

enums:
  AttackDomain:
    description: An ATT&CK technology domain, a separate knowledge base with its own matrix.
    permissible_values:
      enterprise-attack:
        description: Enterprise ATT&CK.
      mobile-attack:
        description: Mobile ATT&CK.
      ics-attack:
        description: ATT&CK for Industrial Control Systems (ICS).

  AttackKillChainName:
    description: The kill chain of an ATT&CK domain, named in a kill chain phase.
    permissible_values:
      mitre-attack:
        description: The kill chain of Enterprise ATT&CK.
      mitre-mobile-attack:
        description: The kill chain of Mobile ATT&CK.
      mitre-ics-attack:
        description: The kill chain of ATT&CK for ICS.

  AttackPlatform:
    description: >-
      A technology environment or operating system that a technique, software,
      analytic or asset applies to.
    permissible_values:
      Android: {}
      Containers: {}
      Control Server: {}
      Data Historian: {}
      Embedded: {}
      Engineering Workstation: {}
      ESXi: {}
      Field Controller/RTU/PLC/IED: {}
      Human-Machine Interface: {}
      IaaS: {}
      Identity Provider: {}
      Input/Output Server: {}
      iOS: {}
      Linux: {}
      macOS: {}
      Network: {}
      Network Devices: {}
      None: {}
      Office 365:
        description: >-
          Not in the ADM's platform list. Three revoked Enterprise techniques
          of the v20.0 data still carry it.
      Office Suite: {}
      PRE: {}
      SaaS: {}
      Safety Instrumented System/Protection Relay: {}
      Windows: {}

  AttackTacticShortname:
    description: >-
      The short name of a tactic. A technique's kill chain phase names a
      tactic of its domain by this name.
    permissible_values:
      collection: {}
      command-and-control: {}
      credential-access: {}
      defense-evasion: {}
      defense-impairment:
        description: Enterprise's TA0112. Not in the ADM's list of short names.
      discovery: {}
      evasion: {}
      execution: {}
      exfiltration: {}
      impact: {}
      impair-process-control: {}
      inhibit-response-function: {}
      initial-access: {}
      lateral-movement: {}
      network-effects: {}
      persistence: {}
      privilege-escalation: {}
      reconnaissance: {}
      remote-service-effects: {}
      resource-development: {}
      stealth:
        description: Enterprise's TA0005. Not in the ADM's list of short names.

  AttackTacticType:
    description: Whether a Mobile technique needs access to the device.
    permissible_values:
      Post-Adversary Device Access: {}
      Pre-Adversary Device Access: {}
      Without Adversary Device Access: {}

  AttackImpactType:
    description: Whether an Enterprise impact technique attacks integrity or availability.
    permissible_values:
      Availability: {}
      Integrity: {}

  AttackRequiredPermission:
    description: A level of permission a technique needs to run on a system.
    permissible_values:
      Administrator: {}
      Remote Desktop Users: {}
      root: {}
      SYSTEM: {}
      User: {}

  AttackEffectivePermission:
    description: A level of permission an adversary gains by a technique.
    permissible_values:
      Administrator: {}
      root: {}
      SYSTEM: {}
      User: {}

  AttackBypassedDefense:
    description: >-
      A defensive tool, method or process that a technique can get past, in the
      spellings the ADM lists.
    permissible_values:
      Anti Virus: {}
      Anti-virus: {}
      Application Control: {}
      Application control: {}
      Application whitelisting: {}
      Autoruns Analysis: {}
      Binary Analysis: {}
      Data Execution Prevention: {}
      Defensive network service scanning: {}
      Digital Certificate Validation: {}
      Encryption: {}
      Exploit Prevention: {}
      File Monitoring: {}
      File monitoring: {}
      File system access controls: {}
      Firewall: {}
      Gatekeeper: {}
      Heuristic Detection: {}
      Heuristic detection: {}
      Host Forensic Analysis: {}
      Host forensic analysis: {}
      Host Intrusion Prevention Systems: {}
      Host intrusion prevention systems: {}
      Log Analysis: {}
      Log analysis: {}
      Logon Credentials: {}
      Multi-Factor Authentication: {}
      Network Intrusion Detection System: {}
      Network intrusion detection system: {}
      Notarization: {}
      Process whitelisting: {}
      Signature-based Detection: {}
      Signature-based detection: {}
      Static File Analysis: {}
      System Access Controls: {}
      System access controls: {}
      User Mode Signature Validation: {}
      Web Content Filters: {}
      Whitelisting by file name or path: {}
      Windows User Account Control: {}

  AttackCollectionLayer:
    description: A place where a data source's data can be collected.
    permissible_values:
      Cloud Control Plane: {}
      Container: {}
      Device: {}
      Host: {}
      Network: {}
      OSINT: {}
      Report: {}

  AttackAssetSector:
    description: An industry sector in which an ICS asset is commonly found.
    permissible_values:
      Electric: {}
      General: {}
      Manufacturing: {}
      Maritime: {}
      Rail: {}
      Water and Wastewater: {}

  AttackRelationshipType:
    description: >-
      The seven relationship types ATT&CK uses. Each allows only some types of
      source and target object, which AttackRelationship's rules state.
    permissible_values:
      uses:
        description: A group, campaign or software uses a technique or software.
      mitigates:
        description: A mitigation mitigates a technique.
      subtechnique-of:
        description: A sub-technique belongs to its parent technique.
      detects:
        description: A detection strategy, or a data component, detects a technique.
      attributed-to:
        description: A campaign is attributed to a group.
      targets:
        description: An ICS technique targets an asset.
      revoked-by:
        description: An object was revoked and replaced by the target object.

slots:
  x_mitre_attack_spec_version:
    description: >-
      The version of the ATT&CK specification the object follows, as
      MAJOR.MINOR.PATCH. Without it, an object is read as version 2.0.0.
    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
    slot_uri: attack:x_mitre_attack_spec_version
  x_mitre_version:
    description: >-
      The version of the object's content, as MAJOR.MINOR with each number
      between 0 and 99. ATT&CK raises it when the content changes.
    pattern: ^\d{1,2}\.\d{1,2}$
    slot_uri: attack:x_mitre_version
  x_mitre_deprecated:
    description: Whether ATT&CK has deprecated the object.
    range: boolean
    slot_uri: attack:x_mitre_deprecated
  x_mitre_old_attack_id:
    description: >-
      An ATT&CK ID the object had before Mobile ATT&CK's objects were renumbered,
      such as MOB-S0012.
    pattern: ^MOB-(M|S)\d{4}$
    slot_uri: attack:x_mitre_old_attack_id
  x_mitre_domains:
    description: The ATT&CK domains the object belongs to.
    range: AttackDomain
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_domains
  x_mitre_modified_by_ref:
    description: >-
      The identity that made the current version of the object: always The
      MITRE Corporation's. Earlier versions may have had other authors.
    range: StixIdentity
    pattern: ^identity--c78cb6e5-0c4b-4611-8297-d1b8b55e40b5$
    slot_uri: attack:x_mitre_modified_by_ref
  x_mitre_contributors:
    description: The people and organizations who contributed to the object.
    multivalued: true
    minimum_cardinality: 1
    pattern: \S
    slot_uri: attack:x_mitre_contributors
  x_mitre_platforms:
    description: The platforms the object applies to, each named once.
    range: AttackPlatform
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_platforms
  x_mitre_aliases:
    description: >-
      Other names of a piece of software. The first is the software's own name.
    multivalued: true
    minimum_cardinality: 1
    pattern: \S
    slot_uri: attack:x_mitre_aliases
  x_mitre_is_subtechnique:
    description: Whether the technique is a sub-technique of another.
    range: boolean
    slot_uri: attack:x_mitre_is_subtechnique
  x_mitre_impact_type:
    description: >-
      Whether an impact technique attacks integrity, availability or both.
    range: AttackImpactType
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_impact_type
    annotations:
      attack_domains: enterprise-attack
      attack_tactic: impact
  x_mitre_network_requirements:
    description: Whether the technique needs a network to run.
    range: boolean
    slot_uri: attack:x_mitre_network_requirements
  x_mitre_tactic_type:
    description: Whether a Mobile technique needs access to the device.
    range: AttackTacticType
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_tactic_type
    annotations:
      attack_domains: mobile-attack
  x_mitre_detection:
    description: How to tell that the technique has been used.
    deprecated: >-
      The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in
      4.0.0; detection strategies and analytics take its place.
    pattern: \S
    slot_uri: attack:x_mitre_detection
  x_mitre_data_sources:
    description: >-
      The data that can reveal the technique, each as "Data Source Name: Data
      Component Name".
    deprecated: >-
      The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in
      4.0.0; detection strategies and analytics take its place.
    multivalued: true
    minimum_cardinality: 1
    pattern: ^\s*[^:\s][^:]*:\s*[^:\s][^:]*$
    slot_uri: attack:x_mitre_data_sources
    annotations:
      attack_excluded_domains: mobile-attack
  x_mitre_defense_bypassed:
    description: The defenses a defense-evasion technique can get past.
    deprecated: >-
      The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in
      4.0.0.
    range: AttackBypassedDefense
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_defense_bypassed
    annotations:
      attack_domains: enterprise-attack
      attack_tactic: defense-evasion
  x_mitre_permissions_required:
    description: >-
      The lowest level of permission a privilege-escalation technique needs on
      a system.
    deprecated: >-
      The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in
      4.0.0.
    range: AttackRequiredPermission
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_permissions_required
    annotations:
      attack_domains: enterprise-attack
      attack_tactic: privilege-escalation
  x_mitre_effective_permissions:
    description: The level of permission a privilege-escalation technique gains.
    deprecated: >-
      The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in
      4.0.0.
    range: AttackEffectivePermission
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_effective_permissions
    annotations:
      attack_domains: enterprise-attack
      attack_tactic: privilege-escalation
  x_mitre_system_requirements:
    description: >-
      What the system must have or be, such as software or a patch level, for
      the technique to work.
    deprecated: >-
      The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in
      4.0.0.
    multivalued: true
    minimum_cardinality: 1
    pattern: \S
    slot_uri: attack:x_mitre_system_requirements
    annotations:
      attack_domains: enterprise-attack
  x_mitre_remote_support:
    description: Whether an execution technique can run something on a remote system.
    deprecated: >-
      The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in
      4.0.0.
    range: boolean
    slot_uri: attack:x_mitre_remote_support
    annotations:
      attack_domains: enterprise-attack
      attack_tactic: execution
  x_mitre_shortname:
    description: >-
      The tactic's short name, which a technique's kill chain phase uses as its
      phase name.
    range: AttackTacticShortname
    slot_uri: attack:x_mitre_shortname
  x_mitre_first_seen_citation:
    description: >-
      The sources for when the campaign was first seen, each written
      "(Citation: name)" with no separator, where each name is the source name
      of one of the campaign's external references.
    pattern: '^(\(Citation: [^)]+\))+$'
    slot_uri: attack:x_mitre_first_seen_citation
  x_mitre_last_seen_citation:
    description: >-
      The sources for when the campaign was last seen, written as
      x_mitre_first_seen_citation is.
    pattern: '^(\(Citation: [^)]+\))+$'
    slot_uri: attack:x_mitre_last_seen_citation
  x_mitre_sectors:
    description: The industry sectors in which the asset is commonly found.
    range: AttackAssetSector
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_sectors
  x_mitre_related_assets:
    description: >-
      The names a sector gives to devices like the asset, each with how it
      relates to the asset.
    range: AttackRelatedAsset
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: attack:x_mitre_related_assets
  related_asset_sectors:
    description: The sectors that use the related asset's name.
    range: AttackAssetSector
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:related_asset_sectors
  x_mitre_collection_layers:
    description: Where the data source's data can be collected.
    range: AttackCollectionLayer
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_collection_layers
  x_mitre_data_source_ref:
    description: The data source the data component belongs to.
    deprecated: >-
      The ADM deprecates it in ATT&CK specification 3.3.0, with data sources,
      and removes it in 4.0.0.
    range: AttackDataSource
    pattern: ^x-mitre-data-source--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: attack:x_mitre_data_source_ref
  x_mitre_log_sources:
    description: >-
      The logs that hold the data component's data, each a pair of log and
      channel that appears once.
    range: AttackLogSource
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: attack:x_mitre_log_sources
  channel:
    description: >-
      A channel or event type within a log, such as 1 for process creation in
      Sysmon.
    pattern: \S
    slot_uri: attack:channel
  x_mitre_analytic_refs:
    description: The analytics that carry out the detection strategy, each named once.
    range: AttackAnalytic
    pattern: ^x-mitre-analytic--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_analytic_refs
  x_mitre_log_source_references:
    description: >-
      The logs the analytic reads, each a data component with a log and
      channel of its own, named once.
    range: AttackLogSourceReference
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: attack:x_mitre_log_source_references
  x_mitre_data_component_ref:
    description: The data component whose log the reference names.
    range: AttackDataComponent
    pattern: ^x-mitre-data-component--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: attack:x_mitre_data_component_ref
  x_mitre_mutable_elements:
    description: >-
      The parts of the analytic a defender may tune to their environment, such
      as a time window, each named once.
    range: AttackMutableElement
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: attack:x_mitre_mutable_elements
  field:
    description: The name of the part of an analytic that can be tuned.
    pattern: \S
    slot_uri: attack:field
  tactic_refs:
    description: >-
      The tactics of the matrix, in the order the matrix shows them. MITRE's
      data writes this ATT&CK property without the x_mitre_ prefix.
    range: AttackTactic
    pattern: ^x-mitre-tactic--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:tactic_refs
  x_mitre_contents:
    description: The objects the collection holds, each at one version.
    range: AttackObjectVersionReference
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: attack:x_mitre_contents

classes:
  AttackTechnique:
    description: >-
      A technique: how an adversary achieves a tactic's goal. A sub-technique
      is a technique too, with x_mitre_is_subtechnique set and a
      subtechnique-of relationship to its parent. Its ATT&CK ID is T and four
      digits, and a sub-technique's adds a full stop and three digits.
    is_a: StixAttackPattern
    slots:
      - x_mitre_attack_spec_version
      - x_mitre_version
      - x_mitre_deprecated
      - x_mitre_old_attack_id
      - x_mitre_domains
      - x_mitre_modified_by_ref
      - x_mitre_contributors
      - x_mitre_platforms
      - x_mitre_is_subtechnique
      - x_mitre_impact_type
      - x_mitre_network_requirements
      - x_mitre_tactic_type
      - x_mitre_detection
      - x_mitre_data_sources
      - x_mitre_defense_bypassed
      - x_mitre_permissions_required
      - x_mitre_effective_permissions
      - x_mitre_system_requirements
      - x_mitre_remote_support
    slot_usage:
      external_references:
        required: true
      kill_chain_phases:
        range: AttackKillChainPhase
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_is_subtechnique:
        required: true
    annotations:
      stix_type: attack-pattern
      attack_id_pattern: ^T\d{4}(\.\d{3})?$

  AttackTactic:
    description: >-
      A tactic: an adversary's goal, the reason for a technique. Its ATT&CK ID
      is TA and four digits.
    is_a: StixDomainObject
    slots:
      - name
      - description
      - x_mitre_attack_spec_version
      - x_mitre_version
      - x_mitre_deprecated
      - x_mitre_old_attack_id
      - x_mitre_domains
      - x_mitre_modified_by_ref
      - x_mitre_contributors
      - x_mitre_shortname
    slot_usage:
      id:
        pattern: ^x-mitre-tactic--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: x-mitre-tactic
      name:
        required: true
      description:
        required: true
      created_by_ref:
        required: true
      object_marking_refs:
        required: true
      external_references:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_modified_by_ref:
        required: true
      x_mitre_shortname:
        required: true
    annotations:
      stix_type: x-mitre-tactic
      attack_id_pattern: ^TA\d{4}$

  AttackGroup:
    description: >-
      A group: a set of related intrusion activity that the security community
      tracks under a name. Its ATT&CK ID is G and four digits.
    is_a: StixIntrusionSet
    slots:
      - x_mitre_attack_spec_version
      - x_mitre_version
      - x_mitre_deprecated
      - x_mitre_old_attack_id
      - x_mitre_domains
      - x_mitre_modified_by_ref
      - x_mitre_contributors
    slot_usage:
      external_references:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
    annotations:
      stix_type: intrusion-set
      attack_id_pattern: ^G\d{4}$

  AttackCampaign:
    description: >-
      A campaign: intrusion activity over a stated period against common
      targets, with the sources for when it was first and last seen. Its
      ATT&CK ID is C and four digits.
    is_a: StixCampaign
    slots:
      - x_mitre_attack_spec_version
      - x_mitre_version
      - x_mitre_deprecated
      - x_mitre_old_attack_id
      - x_mitre_domains
      - x_mitre_modified_by_ref
      - x_mitre_contributors
      - x_mitre_first_seen_citation
      - x_mitre_last_seen_citation
    slot_usage:
      description:
        required: true
      created_by_ref:
        required: true
      object_marking_refs:
        required: true
      revoked:
        required: true
      external_references:
        required: true
      aliases:
        required: true
      first_seen:
        required: true
      last_seen:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_modified_by_ref:
        required: true
      x_mitre_first_seen_citation:
        required: true
      x_mitre_last_seen_citation:
