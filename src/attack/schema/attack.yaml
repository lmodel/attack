      type:
        equals_string: x-mitre-collection
      name:
        required: true
      description:
        required: true
      created_by_ref:
        required: true
      object_marking_refs:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_contents:
        required: true
    annotations:
