      - x_mitre_old_attack_id
      - x_mitre_domains
      - x_mitre_modified_by_ref
      - x_mitre_contributors
      - x_mitre_platforms
      - x_mitre_sectors
      - x_mitre_related_assets
    slot_usage:
      id:
        pattern: ^x-mitre-asset--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: x-mitre-asset
      name:
        required: true
      created_by_ref:
        required: true
      object_marking_refs:
        required: true
      external_references:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
