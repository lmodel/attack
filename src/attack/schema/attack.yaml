        required: true
      description:
        required: true
      external_references:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_modified_by_ref:
        required: true
      x_mitre_old_attack_id:
        pattern: ^MOB-S\d{4}$
    annotations:
      stix_type: malware
      attack_id_pattern: ^S\d{4}$

  AttackTool:
    description: >-
      A tool: software, often legitimate, that an adversary uses, such as a
