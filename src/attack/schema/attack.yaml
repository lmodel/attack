      attack_id_pattern: ^M\d{4}$

  AttackMatrix:
    description: >-
      A matrix: the tactics of a domain, in order, under which its techniques
      are laid out. Its first external reference names the domain.
    is_a: StixDomainObject
    slots:
      - name
      - description
      - x_mitre_attack_spec_version
      - x_mitre_version
      - x_mitre_deprecated
      - x_mitre_old_attack_id
      - x_mitre_domains
      - x_mitre_modified_by_ref
      - tactic_refs
    slot_usage:
      id:
        pattern: ^x-mitre-matrix--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: x-mitre-matrix
      name:
        required: true
      description:
        required: true
      created_by_ref:
        required: true
      object_marking_refs:
        required: true
      external_references:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_modified_by_ref:
        required: true
      tactic_refs:
        required: true
    annotations:
      stix_type: x-mitre-matrix
      attack_id_pattern: ^(enterprise|mobile|ics)-attack$

  AttackCollection:
    description: >-
      A collection: a set of objects, each at one version, published together.
