      attack_id_pattern: ^A\d{4}$

  AttackDataSource:
    description: >-
      A data source: a kind of information that can be collected to detect
      techniques, made of data components. Its ATT&CK ID is DS and four digits.
    deprecated: >-
      The ADM deprecates data sources in ATT&CK specification 3.3.0, in favour
      of detection strategies, and removes them in 4.0.0. Every data source of
      the v20.0 data is deprecated.
    is_a: StixDomainObject
    slots:
      - name
      - description
      - x_mitre_attack_spec_version
      - x_mitre_version
      - x_mitre_deprecated
      - x_mitre_old_attack_id
      - x_mitre_domains
      - x_mitre_modified_by_ref
      - x_mitre_contributors
      - x_mitre_platforms
      - x_mitre_collection_layers
    slot_usage:
      id:
        pattern: ^x-mitre-data-source--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: x-mitre-data-source
      name:
        required: true
      description:
        required: true
      created_by_ref:
        required: true
      object_marking_refs:
        required: true
      external_references:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_modified_by_ref:
        required: true
      x_mitre_collection_layers:
        required: true
    annotations:
      stix_type: x-mitre-data-source
      attack_id_pattern: ^DS\d{4}$

  AttackDataComponent:
    description: >-
      A data component: a specific kind of data, such as process creation,
      with the logs that hold it. Its ATT&CK ID is DC and four digits.
    is_a: StixDomainObject
    slots:
      - name
      - description
      - x_mitre_attack_spec_version
      - x_mitre_version
      - x_mitre_deprecated
      - x_mitre_old_attack_id
      - x_mitre_domains
      - x_mitre_modified_by_ref
      - x_mitre_data_source_ref
      - x_mitre_log_sources
    slot_usage:
      id:
        pattern: ^x-mitre-data-component--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: x-mitre-data-component
      name:
        required: true
      description:
        required: true
      created_by_ref:
        required: true
      object_marking_refs:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_modified_by_ref:
        required: true
    annotations:
      stix_type: x-mitre-data-component
      attack_id_pattern: ^DC\d{4}$

  AttackDetectionStrategy:
    description: >-
      A detection strategy: an approach to detecting a technique, carried out
      by analytics, one for each platform. Its ATT&CK ID is DET and four
      digits.
    is_a: StixDomainObject
    slots:
      - name
      - x_mitre_attack_spec_version
      - x_mitre_version
      - x_mitre_deprecated
      - x_mitre_old_attack_id
      - x_mitre_domains
      - x_mitre_modified_by_ref
      - x_mitre_contributors
      - x_mitre_analytic_refs
    slot_usage:
      id:
        pattern: ^x-mitre-detection-strategy--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: x-mitre-detection-strategy
      name:
        required: true
      created_by_ref:
        required: true
      object_marking_refs:
        required: true
      external_references:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_modified_by_ref:
        required: true
      x_mitre_analytic_refs:
        required: true
    annotations:
      stix_type: x-mitre-detection-strategy
      attack_id_pattern: ^DET\d{4}$

  AttackAnalytic:
    description: >-
      An analytic: detection logic for one platform, with the logs it reads and
      the parts a defender may tune. Its ATT&CK ID is AN and four digits.
    is_a: StixDomainObject
    slots:
      - name
      - description
      - x_mitre_attack_spec_version
      - x_mitre_version
      - x_mitre_deprecated
      - x_mitre_old_attack_id
      - x_mitre_domains
      - x_mitre_modified_by_ref
      - x_mitre_platforms
      - x_mitre_log_source_references
      - x_mitre_mutable_elements
    slot_usage:
      id:
        pattern: ^x-mitre-analytic--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: x-mitre-analytic
      name:
        required: true
      description:
        required: true
      created_by_ref:
        required: true
      object_marking_refs:
        required: true
      external_references:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_platforms:
        required: true
        maximum_cardinality: 1
    annotations:
      stix_type: x-mitre-analytic
      attack_id_pattern: ^AN\d{4}$

  AttackRelationship:
    description: >-
      A relationship between two ATT&CK objects, of one of the seven types
      ATT&CK uses. Its rules say which types of object each type of
      relationship may join.
    is_a: StixRelationship
    slots:
      - x_mitre_attack_spec_version
      - x_mitre_deprecated
      - x_mitre_old_attack_id
      - x_mitre_modified_by_ref
    slot_usage:
      relationship_type:
        range: AttackRelationshipType
      x_mitre_attack_spec_version:
        required: true
      x_mitre_modified_by_ref:
        required: true
    rules:
      - description: >-
          A group, a campaign or software uses a technique or software.
        preconditions:
          slot_conditions:
            relationship_type:
              equals_string: uses
        postconditions:
          slot_conditions:
            source_ref:
              pattern: ^(intrusion-set|campaign|malware|tool)--
            target_ref:
              pattern: ^(attack-pattern|malware|tool)--
      - description: >-
          Software uses techniques, not other software.
        preconditions:
          slot_conditions:
            relationship_type:
              equals_string: uses
            source_ref:
              pattern: ^(malware|tool)--
        postconditions:
          slot_conditions:
            target_ref:
              pattern: ^attack-pattern--
      - description: A mitigation mitigates a technique.
        preconditions:
          slot_conditions:
            relationship_type:
              equals_string: mitigates
        postconditions:
          slot_conditions:
            source_ref:
              pattern: ^course-of-action--
            target_ref:
              pattern: ^attack-pattern--
      - description: A sub-technique belongs to a technique.
        preconditions:
          slot_conditions:
            relationship_type:
              equals_string: subtechnique-of
        postconditions:
          slot_conditions:
            source_ref:
              pattern: ^attack-pattern--
            target_ref:
              pattern: ^attack-pattern--
      - description: >-
          A detection strategy, or a data component as before detection
          strategies, detects a technique.
        preconditions:
          slot_conditions:
            relationship_type:
              equals_string: detects
        postconditions:
          slot_conditions:
            source_ref:
              pattern: ^(x-mitre-detection-strategy|x-mitre-data-component)--
            target_ref:
              pattern: ^attack-pattern--
      - description: A campaign is attributed to a group.
        preconditions:
          slot_conditions:
            relationship_type:
              equals_string: attributed-to
        postconditions:
          slot_conditions:
            source_ref:
              pattern: ^campaign--
            target_ref:
              pattern: ^intrusion-set--
      - description: A technique targets an asset.
        preconditions:
          slot_conditions:
            relationship_type:
              equals_string: targets
        postconditions:
          slot_conditions:
            source_ref:
              pattern: ^attack-pattern--
            target_ref:
              pattern: ^x-mitre-asset--
      - description: >-
          An object that can be revoked is replaced by another such object.
          The ADM asks for one of the same type; the v20.0 data has a malware
          revoked by a tool, so the rule does not.
        preconditions:
          slot_conditions:
            relationship_type:
              equals_string: revoked-by
        postconditions:
          slot_conditions:
            source_ref:
              pattern: ^(attack-pattern|campaign|course-of-action|intrusion-set|malware|tool|x-mitre-asset|x-mitre-data-component)--
            target_ref:
              pattern: ^(attack-pattern|campaign|course-of-action|intrusion-set|malware|tool|x-mitre-asset|x-mitre-data-component)--
    annotations:
      stix_type: relationship

  AttackIdentity:
    description: >-
      The identity of an organization that creates ATT&CK objects; in MITRE's
      data, The MITRE Corporation.
    is_a: StixIdentity
    slots:
      - x_mitre_attack_spec_version
      - x_mitre_deprecated
      - x_mitre_old_attack_id
    slot_usage:
      object_marking_refs:
        required: true
      identity_class:
        required: true
      x_mitre_attack_spec_version:
        required: true
    annotations:
      stix_type: identity

  AttackMarkingDefinition:
    description: >-
      A marking definition for ATT&CK objects, such as MITRE's copyright
      statement, which every object of MITRE's data names.
    is_a: StixMarkingDefinition
    slot_usage:
      created_by_ref:
        required: true
      definition_type:
        pattern: ^(statement|tlp)$
    annotations:
      stix_type: marking-definition

  AttackBundle:
    description: >-
      A bundle of ATT&CK objects, as MITRE publishes each release of a domain:
      the domain's collection first, then the objects it holds. It adds no
      slot to StixBundle, which stays the schema's tree root; the generated
      JSON Schema takes AttackBundle as its top class.
    is_a: StixBundle

  AttackKillChainPhase:
    description: >-
      A phase of an ATT&CK domain's kill chain: the kill chain of the domain and
      the short name of one of its tactics.
    is_a: StixKillChainPhase
    slot_usage:
      kill_chain_name:
        range: AttackKillChainName
      phase_name:
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$

  AttackObjectVersionReference:
    description: An object a collection holds, at the version its modified time names.
    slots:
      - object_ref
      - object_modified
    slot_usage:
      object_ref:
        required: true
      object_modified:
        required: true
        range: stix_timestamp_millis

  AttackRelatedAsset:
    description: >-
      A name a sector gives to devices like an asset, and how such a device
      relates to the asset.
    slots:
      - name
      - related_asset_sectors
      - description
    slot_usage:
      name:
        required: true
      related_asset_sectors:
        required: true
      description:
        required: true

  AttackLogSource:
    description: A log that holds a data component's data, and a channel within it.
    slots:
      - name
      - channel
    slot_usage:
      name:
        required: true
      channel:
        required: true

  AttackLogSourceReference:
    description: >-
      A log an analytic reads: a data component and one of its logs and
      channels.
    slots:
      - x_mitre_data_component_ref
      - name
      - channel
    slot_usage:
      x_mitre_data_component_ref:
        required: true
      name:
        required: true
      channel:
        required: true

  AttackMutableElement:
    description: A part of an analytic a defender may tune, and why it can vary.
    slots:
      - field
      - description
    slot_usage:
      field:
        required: true
      description:
        required: true
