---
id: https://w3id.org/lmodel/stix/stix_vocabularies
name: stix_vocabularies
title: STIX vocabularies and enumerations
description: >-
  The open vocabularies and closed enumerations of STIX 2.1 (section 10), with the Traffic
  Light Protocol levels, the marking definition types and the specification versions. A slot
  that names an open vocabulary also takes any other string.
license: Apache-2.0
see_also:
  - https://docs.oasis-open.org/cti/stix/v2.1/os/stix-v2.1-os.html
default_prefix: stix
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  stix: https://w3id.org/lmodel/stix/
imports:
  - linkml:types
enums:
