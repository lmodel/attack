---
id: https://w3id.org/lmodel/stix/stix_sco
name: stix_sco
title: STIX cyber-observable objects
description: >-
  The eighteen STIX Cyber-observable Objects (SCOs) of STIX 2.1 (section 6), with their predefined
  extensions and the types they embed.
license: Apache-2.0
see_also:
  - https://docs.oasis-open.org/cti/stix/v2.1/os/stix-v2.1-os.html
default_prefix: stix
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  stix: https://w3id.org/lmodel/stix/
  uco-observable: https://ontology.unifiedcyberontology.org/uco/observable/
imports:
  - linkml:types
  - ./stix_vocabularies
  - ./stix_core
slots:
  mime_type:
    description: >-
      The MIME type of the content, as the IANA Media Types registry names it.
    slot_uri: stix:mime_type
  payload_bin:
    description: >-
      Specifies the binary data contained in the artifact as a base64-encoded string.
    range: stix_binary
    slot_uri: stix:payload_bin
  encryption_algorithm:
    description: >-
      If the artifact is encrypted, specifies the type of encryption algorithm the binary
      data (either via payload_bin or url) is encoded in.
    range: StixEncryptionAlgorithm
    slot_uri: stix:encryption_algorithm
  decryption_key:
    description: >-
      Specifies the decryption key for the encrypted binary data (either via payload_bin or
      url).
    slot_uri: stix:decryption_key
  number:
    description: >-
      Specifies the number assigned to the AS. Such assignments are typically performed by
      a Regional Internet Registries (RIR).
    range: integer
    slot_uri: stix:number
  rir:
    description: >-
      Specifies the name of the Regional Internet Registry (RIR) that assigned the number
      to the AS.
    slot_uri: stix:rir
  path:
    description: A path, as it was observed.
    slot_uri: stix:path
  path_enc:
    description: Specifies the observed encoding for the path.
    pattern: ^[a-zA-Z0-9/\.+_:-]{2,250}$
    slot_uri: stix:path_enc
  ctime:
    description: The time at which the object was created.
    range: stix_timestamp
    slot_uri: stix:ctime
  mtime:
    description: The time at which the object was last written to.
    range: stix_timestamp
    slot_uri: stix:mtime
  atime:
    description: The time at which the object was last accessed.
    range: stix_timestamp
    slot_uri: stix:atime
  contains_refs:
    description: References to other cyber-observable objects that this one contains.
    range: StixCyberObservableObject
    pattern: ^(?!(attack-pattern|campaign|course-of-action|grouping|identity|incident|indicator|infrastructure|intrusion-set|location|malware|malware-analysis|note|observed-data|opinion|report|threat-actor|tool|vulnerability|relationship|sighting|bundle|marking-definition|language-content|extension-definition)--)[a-z][a-z0-9-]+[a-z0-9]--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:contains_refs
  value:
    description: The value of the observable, in the form each class states.
    slot_uri: stix:value
  resolves_to_refs:
    description: References to the cyber-observable objects that this one resolves to.
    range: StixCyberObservableObject
    pattern: ^[a-z][a-z0-9-]+[a-z0-9]--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:resolves_to_refs
  display_name:
    description: A name for display.
    slot_uri: stix:display_name
  belongs_to_ref:
    description: >-
      Specifies the user account that the email address belongs to, as a reference to a User
      Account Object.
    range: StixUserAccount
    pattern: ^user-account--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:belongs_to_ref
  email_date:
    alias: date
    description: Specifies the date/time that the email message was sent.
    range: stix_timestamp
    slot_uri: stix:date
  content_type:
    description: The value of a Content-Type header field.
    slot_uri: stix:content_type
  from_ref:
    description: Specifies the value of the 'From:' header of the email message.
    range: StixEmailAddress
    pattern: ^email-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:from_ref
  sender_ref:
    description: Specifies the value of the 'From' field of the email message.
    range: StixEmailAddress
    pattern: ^email-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:sender_ref
  to_refs:
    description: >-
      Specifies the mailboxes that are 'To:' recipients of the email message.
    range: StixEmailAddress
    pattern: ^email-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:to_refs
  cc_refs:
    description: >-
      Specifies the mailboxes that are 'CC:' recipients of the email message.
    range: StixEmailAddress
    pattern: ^email-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:cc_refs
  bcc_refs:
    description: >-
      Specifies the mailboxes that are 'BCC:' recipients of the email message.
    range: StixEmailAddress
    pattern: ^email-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:bcc_refs
  message_id:
    description: Specifies the Message-ID field of the email message.
    slot_uri: stix:message_id
  subject:
    description: A subject, as a string; each class says of what.
    slot_uri: stix:subject
  received_lines:
    description: >-
      Specifies one or more Received header fields that may be included in the email headers.
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:received_lines
  additional_header_fields:
    description: >-
      Specifies any other header fields found in the email message, as a dictionary.
    range: StixDictionary
    inlined: true
    slot_uri: stix:additional_header_fields
  raw_email_ref:
    description: >-
      Specifies the raw binary contents of the email message, including both the headers and
      body, as a reference to an Artifact Object.
    range: StixArtifact
    pattern: ^artifact--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:raw_email_ref
  is_multipart:
    description: Indicates whether the email body contains multiple MIME parts.
    range: boolean
    slot_uri: stix:is_multipart
  body:
    description: A body of text.
    slot_uri: stix:body
  body_multipart:
    description: >-
      The MIME parts that make up a multipart email body.
    comments:
      - >-
        Present only when is_multipart is true.
    range: StixMimePart
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: stix:body_multipart
  size:
    description: A size in bytes, as a non-negative integer.
    range: integer
    minimum_value: 0
    slot_uri: stix:size
  name_enc:
    description: Specifies the observed encoding for the name of the file.
    pattern: ^[a-zA-Z0-9/\.+_:-]{2,250}$
    slot_uri: stix:name_enc
  magic_number_hex:
    description: >-
      Specifies the hexadecimal constant ('magic number') associated with a specific file
      format that corresponds to the file, if applicable.
    range: stix_hex
    slot_uri: stix:magic_number_hex
  parent_directory_ref:
    description: >-
      Specifies the parent directory of the file, as a reference to a Directory Object.
    range: StixDirectory
    pattern: ^directory--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:parent_directory_ref
  content_ref:
    description: Specifies the content of the file, represented as an Artifact Object.
    range: StixArtifact
    pattern: ^artifact--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:content_ref
  belongs_to_refs:
    description: References to the autonomous systems that this address belongs to.
    range: StixAutonomousSystem
    pattern: ^autonomous-system--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:belongs_to_refs
  start:
    description: Specifies the date/time the network traffic was initiated, if known.
    range: stix_timestamp
    slot_uri: stix:start
  end:
    description: Specifies the date/time the network traffic ended, if known.
    range: stix_timestamp
    slot_uri: stix:end
  src_ref:
    description: >-
      Specifies the source of the network traffic, as a reference to an Observable Object.
    range: StixCyberObservableObject
    any_of:
      - range: StixIpv4Address
      - range: StixIpv6Address
      - range: StixMacAddress
      - range: StixDomainName
    pattern: ^(ipv4-addr|ipv6-addr|mac-addr|domain-name)--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:src_ref
  dst_ref:
    description: >-
      Specifies the destination of the network traffic, as a reference to an Observable Object.
    range: StixCyberObservableObject
    any_of:
      - range: StixIpv4Address
      - range: StixIpv6Address
      - range: StixMacAddress
      - range: StixDomainName
    pattern: ^(ipv4-addr|ipv6-addr|mac-addr|domain-name)--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:dst_ref
  src_port:
    description: >-
      The source port of the traffic.
    range: integer
    minimum_value: 0
    maximum_value: 65535
    slot_uri: stix:src_port
  dst_port:
    description: >-
      The destination port of the traffic.
    range: integer
    minimum_value: 0
    maximum_value: 65535
    slot_uri: stix:dst_port
  protocols:
    description: >-
      Specifies the protocols observed in the network traffic, along with their corresponding
      state.
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:protocols
  src_byte_count:
    description: Specifies the number of bytes sent from the source to the destination.
    range: integer
    slot_uri: stix:src_byte_count
  dst_byte_count:
    description: Specifies the number of bytes sent from the destination to the source.
    range: integer
    slot_uri: stix:dst_byte_count
  src_packets:
    description: >-
      Specifies the number of packets sent from the source to the destination.
    range: integer
    slot_uri: stix:src_packets
  dst_packets:
    description: Specifies the number of packets sent destination to the source.
    range: integer
    slot_uri: stix:dst_packets
  ipfix:
    description: Specifies any IP Flow Information Export (IPFIX) data for the traffic.
    range: StixDictionary
    inlined: true
    slot_uri: stix:ipfix
  src_payload_ref:
    description: Specifies the bytes sent from the source to the destination.
    range: StixArtifact
    pattern: ^artifact--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:src_payload_ref
  dst_payload_ref:
    description: Specifies the bytes sent from the source to the destination.
    range: StixArtifact
    pattern: ^artifact--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:dst_payload_ref
  encapsulates_refs:
    description: >-
      Links to other network-traffic objects encapsulated by a network-traffic.
    range: StixNetworkTraffic
    pattern: ^network-traffic--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:encapsulates_refs
  encapsulated_by_ref:
    description: >-
      Links to another network-traffic object which encapsulates this object.
    range: StixNetworkTraffic
    pattern: ^network-traffic--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:encapsulated_by_ref
  is_active:
    description: Indicates whether the network traffic is still ongoing.
    range: boolean
    slot_uri: stix:is_active
  is_hidden:
    description: Specifies whether the process is hidden.
    range: boolean
    slot_uri: stix:is_hidden
  pid:
    description: Specifies the Process ID, or PID, of the process.
    range: integer
    slot_uri: stix:pid
  created_time:
    description: Specifies the date/time at which the process was created.
    range: stix_timestamp
    slot_uri: stix:created_time
  cwd:
    description: Specifies the current working directory of the process.
    slot_uri: stix:cwd
  command_line:
    description: >-
      Specifies the full command line used in executing the process, including the process
      name (which may be specified individually via the binary_ref.name property) and any
      arguments.
    slot_uri: stix:command_line
  environment_variables:
    description: >-
      Specifies the list of environment variables associated with the process as a dictionary.
    range: StixDictionary
    inlined: true
    slot_uri: stix:environment_variables
  opened_connection_refs:
    description: >-
      Specifies the list of network connections opened by the process, as a reference to one
      or more Network Traffic Objects.
    range: StixNetworkTraffic
    pattern: ^network-traffic--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:opened_connection_refs
  creator_user_ref:
    description: A reference to the user account that created the object.
    range: StixUserAccount
    pattern: ^user-account--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:creator_user_ref
  image_ref:
    description: >-
      Specifies the executable binary that was executed as the process image, as a reference
      to a File Object.
    range: StixFile
    pattern: ^file--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:image_ref
  parent_ref:
    description: >-
      Specifies the other process that spawned (i.e. is the parent of) this one, as represented
      by a Process Object.
    range: StixProcess
    pattern: ^process--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:parent_ref
  child_refs:
    description: >-
      Specifies the other processes that were spawned by (i.e. children of) this process,
      as a reference to one or more other Process Objects.
    range: StixProcess
    pattern: ^process--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:child_refs
  cpe:
    description: >-
      The Common Platform Enumeration (CPE) 2.3 name of the software, if it has one.
    comments:
      - >-
        STIX asks for an entry of the NVD CPE Dictionary.
    pattern: cpe:2\.3:[aho\*\-](:(((\?*|\*?)([a-zA-Z0-9\-\._]|(\\[\\\*\?!\x22#$$%&\x27\(\)\+,/:;<=>@\[\]\^`\{\|}~]))+(\?*|\*?))|[\*\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[\*\-]))(:(((\?*|\*?)([a-zA-Z0-9\-\._]|(\\[\\\*\?!\x22#$$%&\x27\(\)\+,/:;<=>@\[\]\^`\{\|}~]))+(\?*|\*?))|[\*\-])){4}
    slot_uri: stix:cpe
  swid:
    description: >-
      Specifies the Software Identification (SWID) Tags entry for the software, if available.
    slot_uri: stix:swid
  languages:
    description: >-
      The languages the software supports, as RFC 5646 language codes.
    comments:
      - >-
        ISO 639-2 codes are accepted too, for backward compatibility.
    pattern: ^([a-z]{2}(-[A-Z]{2})?(-[a-z]{4})?(-[A-Z]{2}|[0-9]{3})?(-[a-z0-9]{5,8}|[0-9][a-z0-9]{3})*(-[a-z0-9]{1,8})*|[a-z]{3})$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:languages
  vendor:
    description: Specifies the name of the vendor of the software.
    slot_uri: stix:vendor
  user_id:
    description: Specifies the identifier of the account.
    slot_uri: stix:user_id
  credential:
    description: >-
      A cleartext credential, such as a hard-coded password that malware tries for lateral
      movement.
    comments:
      - >-
        Meant for metadata from malware analysis, not for sharing personal information.
    slot_uri: stix:credential
  account_login:
    description: >-
      Specifies the account login string, used in cases where the user_id property specifies
      something other than what a user would type when they login.
    slot_uri: stix:account_login
  account_type:
    description: >-
      The type of the account, such as unix or ldap.
    any_of:
      - range: StixAccountType
      - range: string
    slot_uri: stix:account_type
  is_service_account:
    description: >-
      Indicates that the account is associated with a network service or system process (daemon),
      not a specific individual.
    range: boolean
    slot_uri: stix:is_service_account
  is_privileged:
    description: >-
      Specifies that the account has elevated privileges (i.e., in the case of root on Unix
      or the Windows Administrator account).
    range: boolean
    slot_uri: stix:is_privileged
  can_escalate_privs:
    description: >-
      Specifies that the account has the ability to escalate privileges (i.e., in the case
      of sudo on Unix or a Windows Domain Admin account).
    range: boolean
    slot_uri: stix:can_escalate_privs
  is_disabled:
    description: Specifies if the account is disabled.
    range: boolean
    slot_uri: stix:is_disabled
  account_created:
    description: Specifies when the account was created.
    range: stix_timestamp
    slot_uri: stix:account_created
  account_expires:
    description: Specifies the expiration date of the account.
    range: stix_timestamp
    slot_uri: stix:account_expires
  credential_last_changed:
    description: Specifies when the account credential was last changed.
    range: stix_timestamp
    slot_uri: stix:credential_last_changed
  account_first_login:
    description: Specifies when the account was first accessed.
    range: stix_timestamp
    slot_uri: stix:account_first_login
  account_last_login:
    description: Specifies when the account was last accessed.
    range: stix_timestamp
    slot_uri: stix:account_last_login
  key:
    description: Specifies the full registry key including the hive.
    slot_uri: stix:key
  values:
    description: Specifies the values found under the registry key.
    range: StixWindowsRegistryValue
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: stix:values
  modified_time:
    description: Specifies the last date/time that the registry key was modified.
    range: stix_timestamp
    slot_uri: stix:modified_time
  number_of_subkeys:
    description: Specifies the number of subkeys contained under the registry key.
    range: integer
    slot_uri: stix:number_of_subkeys
  is_self_signed:
    description: >-
      Specifies whether the certificate is self-signed, i.e., whether it is signed by the
      same entity whose identity it certifies.
    range: boolean
    slot_uri: stix:is_self_signed
  serial_number:
    description: >-
      Specifies the unique identifier for the certificate, as issued by a specific Certificate
      Authority.
    slot_uri: stix:serial_number
  signature_algorithm:
    description: Specifies the name of the algorithm used to sign the certificate.
    slot_uri: stix:signature_algorithm
  issuer:
    description: >-
      Specifies the name of the Certificate Authority that issued the certificate.
    slot_uri: stix:issuer
  validity_not_before:
    description: Specifies the date on which the certificate validity period begins.
    range: stix_timestamp
    slot_uri: stix:validity_not_before
  validity_not_after:
    description: Specifies the date on which the certificate validity period ends.
    range: stix_timestamp
    slot_uri: stix:validity_not_after
  subject_public_key_algorithm:
    description: >-
      Specifies the name of the algorithm with which to encrypt data being sent to the subject.
    slot_uri: stix:subject_public_key_algorithm
  subject_public_key_modulus:
    description: Specifies the modulus portion of the subject's public RSA key.
    slot_uri: stix:subject_public_key_modulus
  subject_public_key_exponent:
    description: >-
      Specifies the exponent portion of the subject's public RSA key, as an integer.
    range: integer
    slot_uri: stix:subject_public_key_exponent
  x509_v3_extensions:
    description: >-
      Specifies any standard X.509 v3 extensions that may be used in the certificate.
    range: StixX509V3Extensions
    inlined: true
    slot_uri: stix:x509_v3_extensions
  sid:
    description: Specifies the security ID (SID) value assigned to the file.
    slot_uri: stix:sid
  alternate_data_streams:
    description: >-
      Specifies a list of NTFS alternate data streams that exist for the file.
    range: StixAlternateDataStream
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: stix:alternate_data_streams
  image_height:
