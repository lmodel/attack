      - slot_conditions:
          body:
            required: true
      - slot_conditions:
          body_raw_ref:
            required: true
    rules:
      - description: body and body_raw_ref exclude each other.
        preconditions:
          slot_conditions:
            body:
              value_presence: PRESENT
