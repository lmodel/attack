classes:
  StixArtifact:
    description: >-
      An array of bytes, carried as base64 in payload_bin, or a link to a file-like payload.
    is_a: StixCyberObservableObject
    slots:
      - mime_type
      - payload_bin
      - url
      - hashes
      - encryption_algorithm
      - decryption_key
    slot_usage:
      id:
        pattern: ^artifact--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: artifact
      mime_type:
        pattern: ^(application|audio|font|image|message|model|multipart|text|video)/[a-zA-Z0-9.+_-]+
    any_of:
      - slot_conditions:
          payload_bin:
            required: true
      - slot_conditions:
          url:
            required: true
    rules:
      - description: payload_bin and url exclude each other.
        preconditions:
          slot_conditions:
            payload_bin:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            url:
              value_presence: ABSENT
      - description: An artifact given by url carries its hashes.
        preconditions:
          slot_conditions:
            url:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            hashes:
              required: true
      - description: A decryption key needs an encryption algorithm.
        preconditions:
          slot_conditions:
            decryption_key:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            encryption_algorithm:
              required: true
    annotations:
      stix_type: artifact
  StixAutonomousSystem:
    description: The AS object represents the properties of an Autonomous Systems (AS).
    is_a: StixCyberObservableObject
    slots:
      - number
      - name
      - rir
    slot_usage:
      id:
        pattern: ^autonomous-system--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: autonomous-system
      number:
        required: true
    annotations:
      stix_type: autonomous-system
    close_mappings:
      - uco-observable:AutonomousSystem
  StixDirectory:
    description: >-
      The Directory Object represents the properties common to a file system directory.
    is_a: StixCyberObservableObject
    slots:
      - path
      - path_enc
      - ctime
      - mtime
      - atime
      - contains_refs
    slot_usage:
      id:
        pattern: ^directory--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: directory
      path:
        required: true
      contains_refs:
        range: StixCyberObservableObject
        any_of:
          - range: StixFile
          - range: StixDirectory
        pattern: ^(file|directory)--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    annotations:
      stix_type: directory
    close_mappings:
      - uco-observable:Directory
  StixDomainName:
    description: The Domain Name represents the properties of a network domain name.
    is_a: StixCyberObservableObject
    slots:
      - value
      - resolves_to_refs
    slot_usage:
      id:
        pattern: ^domain-name--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: domain-name
      value:
        required: true
      resolves_to_refs:
        range: StixCyberObservableObject
        any_of:
          - range: StixIpv4Address
          - range: StixIpv6Address
          - range: StixDomainName
        pattern: ^(ipv4-addr|ipv6-addr|domain-name)--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    annotations:
      stix_type: domain-name
    close_mappings:
      - uco-observable:DomainName
  StixEmailAddress:
    description: The Email Address Object represents a single email address.
    is_a: StixCyberObservableObject
    slots:
      - value
      - display_name
      - belongs_to_ref
    slot_usage:
      id:
        pattern: ^email-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        equals_string: email-addr
      value:
        required: true
    annotations:
      stix_type: email-addr
    close_mappings:
      - uco-observable:EmailAddress
  StixEmailMessage:
    description: The Email Message Object represents an instance of an email message.
    is_a: StixCyberObservableObject
    slots:
      - email_date
      - content_type
      - from_ref
      - sender_ref
      - to_refs
      - cc_refs
      - bcc_refs
      - message_id
      - subject
      - received_lines
      - additional_header_fields
      - raw_email_ref
      - is_multipart
      - body
      - body_multipart
    slot_usage:
      id:
