---
# https://pre-commit.com/
# No hook may rewrite a file this repository does not write by hand: MITRE's
# licence and the ATT&CK objects copied unchanged beside it; lmodel/stix's
# modules, which a test holds to their git object hashes; what the LinkML
# generators and `lokf adapt` write, which the next run would rewrite back;
# the neighbours' released copies; npm's lockfile for the release tools; and
# the KTL sidecar's scripts, which the weekly sync replaces.
exclude: >-
  (?x)^(
    tests/data/attack-stix-data/(LICENSE\.txt|extract/)|
    src/attack/schema/stix/|
    src/attack/datamodel/|
    project/|
    docs/schema/|
    \.lokf/(scripts|m365)/|
    \.lokf/(lokf|attack)\.yaml$|
    \.github/release/package-lock\.json$|
    tests/neighbours/
  )
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        # mkdocs.yml uses !!python/name tags unsupported by the safe YAML loader
        exclude: ^mkdocs\.yml$
      - id: end-of-file-fixer
        exclude: ^\.copier-answers\.yml$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]
        exclude: ^\.copier-answers\.yml$
        verbose: true  # Show warnings.

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/crate-ci/typos
    rev: v1.46.3
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.14
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.16
    hooks:
      - id: uv-lock
