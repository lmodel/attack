      type:
        name: type
        equals_string: artifact
      mime_type:
        name: mime_type
        pattern: ^(application|audio|font|image|message|model|multipart|text|video)/[a-zA-Z0-9.+_-]+
    class_uri: stix:StixArtifact
    rules:
    - preconditions:
        slot_conditions:
          payload_bin:
            name: payload_bin
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          url:
            name: url
            value_presence: ABSENT
      description: payload_bin and url exclude each other.
    - preconditions:
        slot_conditions:
          url:
            name: url
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          hashes:
            name: hashes
            required: true
      description: An artifact given by url carries its hashes.
    - preconditions:
        slot_conditions:
          decryption_key:
            name: decryption_key
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          encryption_algorithm:
            name: encryption_algorithm
            required: true
      description: A decryption key needs an encryption algorithm.
    any_of:
