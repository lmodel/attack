    - AttackGroup
    - AttackCampaign
    - AttackMalware
    - AttackTool
    - AttackMitigation
    - AttackMatrix
    - AttackCollection
    - AttackAsset
    - AttackDataSource
    - AttackDataComponent
    - AttackDetectionStrategy
    - AttackAnalytic
    - AttackRelationship
    - AttackIdentity
    range: boolean
  x_mitre_old_attack_id:
    name: x_mitre_old_attack_id
    definition_uri: https://w3id.org/lmodel/attack/x_mitre_old_attack_id
    description: An ATT&CK ID the object had before Mobile ATT&CK's objects were renumbered,
      such as MOB-S0012.
    deprecated: The ADM v4.11.7 marks it as deprecated, a legacy of the Mobile IDs
      that current ATT&CK IDs replaced, and names no release that removes it.
    from_schema: https://w3id.org/lmodel/attack
    mappings:
    - attack:x_mitre_old_attack_id
    slot_uri: attack:x_mitre_old_attack_id
    owner: AttackIdentity
    domain_of:
    - AttackTechnique
    - AttackTactic
    - AttackGroup
    - AttackCampaign
    - AttackMalware
    - AttackTool
    - AttackMitigation
    - AttackMatrix
    - AttackCollection
    - AttackAsset
    - AttackDataSource
    - AttackDataComponent
    - AttackDetectionStrategy
    - AttackAnalytic
    - AttackRelationship
    - AttackIdentity
    range: string
    pattern: ^MOB-(M|S)\d{4}$
  x_mitre_domains:
    name: x_mitre_domains
