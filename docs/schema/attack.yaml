    from_schema: https://w3id.org/lmodel/stix/stix_sdo
    close_mappings:
    - uco-location:Location
    is_a: StixDomainObject
    slots:
    - object_marking_refs
    - granular_markings
    - extensions
    - created_by_ref
    - StixCommonObject_created
    - StixCommonObject_modified
    - revoked
    - labels
    - confidence
    - lang
    - external_references
    - StixCommonObject_spec_version
    - description
    - name
    - latitude
    - longitude
    - precision
    - region
    - country
    - administrative_area
    - city
    - street_address
    - postal_code
    - StixLocation_id
    - StixLocation_type
    slot_usage:
      id:
        name: id
        pattern: ^location--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        name: type
        equals_string: location
    class_uri: stix:StixLocation
    rules:
    - preconditions:
        slot_conditions:
          latitude:
            name: latitude
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          longitude:
            name: longitude
            required: true
      description: A latitude needs a longitude.
    - preconditions:
        slot_conditions:
          longitude:
            name: longitude
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          latitude:
            name: latitude
            required: true
      description: A longitude needs a latitude.
    - preconditions:
        slot_conditions:
          precision:
            name: precision
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          latitude:
            name: latitude
            required: true
          longitude:
            name: longitude
            required: true
      description: A precision needs a latitude and a longitude.
    any_of:
    - slot_conditions:
        region:
          name: region
          required: true
    - slot_conditions:
        country:
          name: country
          required: true
    - slot_conditions:
        latitude:
          name: latitude
          required: true
        longitude:
          name: longitude
          required: true
