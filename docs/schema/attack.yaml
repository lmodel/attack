slots:
  x_mitre_attack_spec_version:
    name: x_mitre_attack_spec_version
    definition_uri: https://w3id.org/lmodel/attack/x_mitre_attack_spec_version
    description: The version of the ATT&CK specification the object follows, as MAJOR.MINOR.PATCH.
      Without it, an object is read as version 2.0.0.
    from_schema: https://w3id.org/lmodel/attack
    mappings:
    - attack:x_mitre_attack_spec_version
    slot_uri: attack:x_mitre_attack_spec_version
    owner: AttackIdentity
    domain_of:
    - AttackTechnique
    - AttackTactic
    - AttackGroup
    - AttackCampaign
    - AttackMalware
    - AttackTool
    - AttackMitigation
    - AttackMatrix
    - AttackCollection
    - AttackAsset
    - AttackDataSource
    - AttackDataComponent
    - AttackDetectionStrategy
    - AttackAnalytic
    - AttackRelationship
    - AttackIdentity
    range: string
    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
  x_mitre_version:
    name: x_mitre_version
    definition_uri: https://w3id.org/lmodel/attack/x_mitre_version
    description: The version of the object's content, as MAJOR.MINOR with each number
      between 0 and 99. ATT&CK raises it when the content changes.
    from_schema: https://w3id.org/lmodel/attack
    mappings:
    - attack:x_mitre_version
    slot_uri: attack:x_mitre_version
    owner: AttackAnalytic
    domain_of:
    - AttackTechnique
    - AttackTactic
    - AttackGroup
    - AttackCampaign
    - AttackMalware
    - AttackTool
    - AttackMitigation
    - AttackMatrix
    - AttackCollection
    - AttackAsset
    - AttackDataSource
    - AttackDataComponent
    - AttackDetectionStrategy
    - AttackAnalytic
    range: string
    pattern: ^\d{1,2}\.\d{1,2}$
  x_mitre_deprecated:
    name: x_mitre_deprecated
    definition_uri: https://w3id.org/lmodel/attack/x_mitre_deprecated
