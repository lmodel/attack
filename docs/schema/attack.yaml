name: attack
annotations:
  attack_release_date:
    tag: attack_release_date
    value: '2026-10-13'
  attack_stix_data_commit:
    tag: attack_stix_data_commit
    value: 20664a889568dce884a1dac0ec7b12ae3a199f51
  attack_spec_version:
    tag: attack_spec_version
    value: 3.3.0
  attack_data_model_release:
    tag: attack_data_model_release
    value: v4.11.7
  attack_data_model_commit:
    tag: attack_data_model_commit
    value: 99558689a7efecbb9eec74b1b1a5b6fbfad25f8a
  stix_version:
    tag: stix_version
    value: '2.1'
description: 'A LinkML model of MITRE ATT&CK as MITRE publishes it in STIX 2.1: the
  tactics, techniques, groups, campaigns, software, mitigations, assets, data sources,
  data components, detection strategies and analytics of the Enterprise, Mobile and
  ICS domains, and the matrices, collections, relationships, identity and marking
  that hold them together. Each class extends the lmodel/stix class it builds on,
  and ATT&CK''s own properties keep the keys MITRE''s data writes, so MITRE''s bundles
  validate unchanged.'
title: MITRE ATT&CK
comments:
- The version is the ATT&CK release the schema renders, and source is that release
  of mitre-attack/attack-stix-data, at the commit in the annotations. tests/data/attack-stix-data/manifest.json
  pins its bundles by hash, and scripts/check_upstream_release.py reports a newer
  release.
- The ATT&CK Data Model (ADM), mitre-attack/attack-data-model, defines the STIX extensions
  ATT&CK uses. MITRE marks every release of its v4.11 line as a pre-release, published
  under npm's next tag, while npm's latest is v4.10.1. The schema follows v4.11.7
  all the same, because the schema fixes of v4.11.1 to v4.11.6 match the v20.0 data,
  which post-dates them.
- The schema follows the data MITRE publishes. Where the v20.0 data departs from the
  ADM, the schema accepts the data, and tests/test_upstream.py lists each departure
  with its reason.
- Some of the ADM's rules are beyond the validator, such as the order of a list or
  a rule across a bundle. tests/attack_rules.py checks them over the examples and
  the bundles, and docs/index.md lists them; the annotations attack_id_pattern, attack_domains,
  attack_excluded_domains and attack_tactic give the values those rules read.
source: https://github.com/mitre-attack/attack-stix-data/releases/tag/v20.0
see_also:
- https://lmodel.github.io/attack
- https://attack.mitre.org/resources/versions/
- https://mitre-attack.github.io/attack-data-model/schemas/
