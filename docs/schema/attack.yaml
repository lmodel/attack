  StixObservedData:
    name: StixObservedData
    definition_uri: https://w3id.org/lmodel/stix/StixObservedData
    annotations:
      stix_type:
        tag: stix_type
        value: observed-data
    description: Observed data conveys information that was observed on systems and
      networks, such as log data or network traffic, using the Cyber Observable specification.
    from_schema: https://w3id.org/lmodel/stix/stix_sdo
    is_a: StixDomainObject
    slots:
    - object_marking_refs
    - granular_markings
    - extensions
    - created_by_ref
    - StixCommonObject_created
    - StixCommonObject_modified
    - revoked
    - labels
    - confidence
    - lang
    - external_references
    - StixCommonObject_spec_version
    - StixObservedData_first_observed
    - StixObservedData_last_observed
    - StixObservedData_number_observed
    - StixObservedData_objects
    - StixObservedData_object_refs
    - StixObservedData_id
    - StixObservedData_type
    slot_usage:
      id:
        name: id
        pattern: ^observed-data--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      type:
        name: type
        equals_string: observed-data
      first_observed:
        name: first_observed
        required: true
      last_observed:
        name: last_observed
        required: true
      number_observed:
        name: number_observed
        required: true
      object_refs:
        name: object_refs
        range: StixObject
        pattern: ^(?!(attack-pattern|campaign|course-of-action|grouping|identity|incident|indicator|infrastructure|intrusion-set|location|malware|malware-analysis|note|observed-data|opinion|report|threat-actor|tool|vulnerability)--)[a-z][a-z0-9-]+[a-z0-9]--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        any_of:
        - range: StixCyberObservableObject
        - range: StixRelationshipObject
      objects:
        name: objects
        description: The observed cyber-observable objects, as a dictionary keyed
          by index. Deprecated in STIX 2.1; use object_refs.
        range: StixObservedObjects
        inlined: true
    class_uri: stix:StixObservedData
    rules:
    - preconditions:
        slot_conditions:
          objects:
            name: objects
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          object_refs:
            name: object_refs
            value_presence: ABSENT
      description: objects and object_refs exclude each other.
    any_of:
    - slot_conditions:
        objects:
          name: objects
          required: true
    - slot_conditions:
        object_refs:
          name: object_refs
          required: true
