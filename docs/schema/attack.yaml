    annotations:
      stix_type:
        tag: stix_type
        value: artifact
    description: The Artifact Object permits capturing an array of bytes (8-bits),
      as a base64-encoded string string, or linking to a file-like payload.
    from_schema: https://w3id.org/lmodel/stix/stix_sco
    is_a: StixCyberObservableObject
    slots:
    - spec_version
    - object_marking_refs
    - granular_markings
    - extensions
    - defanged
    - StixArtifact_mime_type
    - payload_bin
    - url
    - hashes
    - encryption_algorithm
    - decryption_key
