  stix_identifier:
    name: stix_identifier
    definition_uri: https://w3id.org/lmodel/stix/StixIdentifier
    description: 'A STIX identifier: an object''s type name, two hyphens and a UUID,
      such as indicator--8e2e2d2b-17d4-4cbf-938f-98ee46b3cd3f.'
    from_schema: https://w3id.org/lmodel/stix/stix_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[a-z][a-z0-9-]+[a-z0-9]--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
  stix_timestamp:
    name: stix_timestamp
    definition_uri: https://w3id.org/lmodel/stix/StixTimestamp
    description: An RFC 3339 timestamp in UTC, ending in Z, with any precision of
      fractional seconds.
    from_schema: https://w3id.org/lmodel/stix/stix_core
    typeof: string
    base: str
    uri: xsd:dateTime
    pattern: ^[0-9]{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):([0-5][0-9]):([0-5][0-9]|60)(\.[0-9]+)?Z$
  stix_timestamp_millis:
    name: stix_timestamp_millis
    definition_uri: https://w3id.org/lmodel/stix/StixTimestampMillis
    description: 'A timestamp precise to the millisecond or finer: at least three
      digits of fractional seconds, as STIX requires of created and modified.'
    from_schema: https://w3id.org/lmodel/stix/stix_core
    typeof: string
    base: str
    uri: xsd:dateTime
    pattern: ^[0-9]{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):([0-5][0-9]):([0-5][0-9]|60)\.[0-9]{3,}Z$
  stix_timestamp_seconds:
    name: stix_timestamp_seconds
    definition_uri: https://w3id.org/lmodel/stix/StixTimestampSeconds
    description: A timestamp precise to the second, with no fractional seconds.
    from_schema: https://w3id.org/lmodel/stix/stix_core
    typeof: string
    base: str
    uri: xsd:dateTime
    pattern: ^[0-9]{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):([0-5][0-9]):([0-5][0-9]|60)Z$
  stix_hex:
    name: stix_hex
    definition_uri: https://w3id.org/lmodel/stix/StixHex
    description: Octets encoded as an even number of hexadecimal digits.
    from_schema: https://w3id.org/lmodel/stix/stix_core
    typeof: string
    base: str
    uri: xsd:hexBinary
    pattern: ^([a-fA-F0-9]{2})+$
  stix_binary:
    name: stix_binary
    definition_uri: https://w3id.org/lmodel/stix/StixBinary
    description: Bytes encoded in base64, as RFC 4648 specifies.
    from_schema: https://w3id.org/lmodel/stix/stix_core
    typeof: string
    base: str
    uri: xsd:base64Binary
    pattern: ^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{4}|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{2}==)$
