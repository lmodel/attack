      source_name:
        name: source_name
        required: true
    class_uri: stix:StixExternalReference
    rules:
    - preconditions:
        slot_conditions:
          source_name:
            name: source_name
            equals_string: cve
      postconditions:
        slot_conditions:
          external_id:
            name: external_id
            required: true
            pattern: ^CVE-\d{4}-(0\d{3}|[1-9]\d{3,})$
      description: A reference to the CVE list names a CVE identifier.
    - preconditions:
        slot_conditions:
          source_name:
            name: source_name
            equals_string: capec
      postconditions:
        slot_conditions:
          external_id:
            name: external_id
            required: true
            pattern: ^CAPEC-\d+$
      description: A reference to CAPEC names a CAPEC identifier.
