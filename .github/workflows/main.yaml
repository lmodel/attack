# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

env:
  FORCE_COLOR: "1"  # Make tools pretty.

permissions: {}

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: |
          uv tool install rust-just==1.47.0

      - name: Install project
        run: uv sync --locked --group dev

      # A warning fails the step as an error does, as `just lint` reports it.
      - name: Lint the schema
        if: matrix.python-version == '3.13'
        run: just lint

      - name: Run test suite
        run: just test

  # The full ATT&CK bundles stay out of git: this job fetches them, checks
  # their hashes against tests/data/attack-stix-data/manifest.json, and
  # validates every object on its own. The cache keeps them between runs
  # until the manifest moves.
  attack-data:
    name: Validate the pinned ATT&CK bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore the bundles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/attack-stix-data
          key: attack-stix-data-${{ hashFiles('tests/data/attack-stix-data/manifest.json') }}

      - name: Install just
        run: |
          uv tool install rust-just==1.47.0

      - name: Install project
        run: uv sync --locked --group dev

      - name: Fetch and validate the bundles
        run: just test-attack-data
